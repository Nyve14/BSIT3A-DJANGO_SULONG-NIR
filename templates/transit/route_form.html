{% extends "theme/base.html" %}
{% load i18n %}
{% block content %}
<div class="container-xl">
  <div class="page-header d-print-none">
    <div class="row align-items-center">
      <div class="col">
        <div class="page-pretitle">Sulong-NIR</div>
        <h2 class="page-title mb-0">{% if route %}{% trans "Edit route" %}{% else %}{% trans "Add route" %}{% endif %}</h2>
      </div>
      <div class="col-auto">
        <a class="btn btn-outline-secondary" href="{% url 'transit:route_list' %}"><i class="fas fa-arrow-left me-2"></i>{% trans "Back to routes" %}</a>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-8 col-xl-7">
      <form method="post" class="card">
        {% csrf_token %}
        <div class="card-header">
          <h3 class="card-title mb-0">{% trans "Route details" %}</h3>
        </div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">{% trans "Agency" %}</label>
            <select name="agency" class="form-select" required>
              {% for ag in agencies %}
              <option value="{{ ag.id }}" {% if route and route.agency_id == ag.id %}selected{% endif %}>{{ ag.name }} ({{ ag.short_name }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">{% trans "Short name" %}</label>
            <input type="text" name="short_name" class="form-control" maxlength="50" required value="{{ route.short_name|default:'' }}" placeholder="e.g., Bacolod - Dumaguete">
          </div>
          <div class="mb-3">
            <label class="form-label">{% trans "Long name" %}</label>
            <input type="text" name="long_name" class="form-control" maxlength="200" value="{{ route.long_name|default:'' }}" placeholder="Full route description">
          </div>
          <div class="mb-3">
            <label class="form-label">{% trans "Description" %}</label>
            <textarea name="description" class="form-control" rows="3" placeholder="Route description">{{ route.description|default:'' }}</textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">{% trans "Vehicle type" %}</label>
            <select name="vehicle_type" class="form-select" required>
              {% for value, label in vehicle_types %}
              <option value="{{ value }}" {% if route and route.vehicle_type == value %}selected{% endif %}>{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">{% trans "Route color" %}</label>
            <input type="color" name="color" class="form-control form-control-color" value="{{ route.color|default:'#3B82F6' }}" title="Choose route color for map">
          </div>
        </div>
        <div class="card-footer d-flex justify-content-between">
          <a class="btn btn-ghost-secondary" href="{% url 'transit:route_list' %}">{% trans "Cancel" %}</a>
          <button class="btn btn-primary" type="submit"><i class="fas fa-save me-2"></i>{% trans "Save route" %}</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
